metrics:
  - name: 页面浏览量
    description: 页面访问事件行数，公式为 COUNT(page_view_id)
    relevant_columns:
      - t_name: dwd_traffic_page_view_di
        c_name: page_view_id
      - t_name: dwd_traffic_page_view_di
        c_name: biz_date
    alias:
      - PV
      - 浏览量
      - 访问量
  - name: 访客数
    description: 按用户优先、匿名设备兜底去重的访问主体数，公式为 COUNT(DISTINCT COALESCE(user_id, device_id))
    relevant_columns:
      - t_name: dwd_traffic_page_view_di
        c_name: user_id
      - t_name: dwd_traffic_page_view_di
        c_name: device_id
      - t_name: dwd_traffic_page_view_di
        c_name: biz_date
    alias:
      - UV
      - 独立访客数
  - name: 会话数
    description: 客户端会话数量，公式为 COUNT(DISTINCT session_id)
    relevant_columns:
      - t_name: dwd_traffic_session_di
        c_name: session_id
      - t_name: dwd_traffic_session_di
        c_name: biz_date
    alias:
      - 访问次数
      - Session数
  - name: 活跃用户数
    description: 发生会话的登录用户数，排除游客，公式为 COUNT(DISTINCT user_id)
    relevant_columns:
      - t_name: dwd_traffic_session_di
        c_name: user_id
      - t_name: dwd_traffic_session_di
        c_name: biz_date
    alias:
      - 活跃会员数
  - name: 跳出率
    description: 跳出会话数除以全部会话数，跳出会话取 is_bounce=1
    relevant_columns:
      - t_name: dwd_traffic_session_di
        c_name: is_bounce
      - t_name: dwd_traffic_session_di
        c_name: session_id
    alias:
      - 会话跳出率
  - name: 平均会话时长
    description: 会话持续秒数的平均值，公式为 AVG(session_duration_sec)
    relevant_columns:
      - t_name: dwd_traffic_session_di
        c_name: session_duration_sec
    alias:
      - 平均访问时长
  - name: 会话平均浏览深度
    description: 页面浏览量除以会话数，也可取会话表 page_view_count 的平均值
    relevant_columns:
      - t_name: dwd_traffic_session_di
        c_name: page_view_count
      - t_name: dwd_traffic_session_di
        c_name: session_id
    alias:
      - 平均访问深度
      - 每次访问页数
  - name: 人均浏览量
    description: 页面浏览量除以访客数
    relevant_columns:
      - t_name: dwd_traffic_page_view_di
        c_name: page_view_id
      - t_name: dwd_traffic_page_view_di
        c_name: user_id
      - t_name: dwd_traffic_page_view_di
        c_name: device_id
    alias:
      - 人均PV
  - name: 平均页面停留时长
    description: 页面停留秒数的平均值，公式为 AVG(stay_duration_sec)
    relevant_columns:
      - t_name: dwd_traffic_page_view_di
        c_name: stay_duration_sec
    alias:
      - 平均停留时间
  - name: 搜索次数
    description: 搜索请求数量，公式为 COUNT(search_detail_id)
    relevant_columns:
      - t_name: dwd_traffic_search_di
        c_name: search_detail_id
      - t_name: dwd_traffic_search_di
        c_name: biz_date
    alias:
      - 搜索量
      - 搜索PV
  - name: 搜索用户数
    description: 发起搜索的登录用户去重数，公式为 COUNT(DISTINCT user_id)
    relevant_columns:
      - t_name: dwd_traffic_search_di
        c_name: user_id
      - t_name: dwd_traffic_search_di
        c_name: biz_date
    alias:
      - 搜索UV
  - name: 搜索无结果率
    description: 无结果搜索次数除以搜索次数，取 is_no_result=1
    relevant_columns:
      - t_name: dwd_traffic_search_di
        c_name: is_no_result
      - t_name: dwd_traffic_search_di
        c_name: search_detail_id
    alias:
      - 零结果率
  - name: 搜索点击次数
    description: 搜索结果点击事件数，公式为 COUNT(search_click_id)
    relevant_columns:
      - t_name: dwd_traffic_search_click_di
        c_name: search_click_id
      - t_name: dwd_traffic_search_click_di
        c_name: biz_date
    alias:
      - 搜索点击量
  - name: 搜索点击率
    description: 产生至少一次点击的搜索请求数除以成功搜索请求数
    relevant_columns:
      - t_name: dwd_traffic_search_di
        c_name: search_detail_id
      - t_name: dwd_traffic_search_di
        c_name: is_search_success
      - t_name: dwd_traffic_search_click_di
        c_name: search_detail_id
    alias:
      - 搜索CTR
  - name: 平均搜索点击位次
    description: 搜索点击结果位次的平均值，数值越小表示结果排序越靠前
    relevant_columns:
      - t_name: dwd_traffic_search_click_di
        c_name: click_rank
    alias:
      - 平均点击排名
  - name: 加购次数
