  - name: 收藏用户数
    description: 发生收藏事件的去重用户数
    relevant_columns:
      - t_name: dwd_interaction_favor_event_di
        c_name: user_id
      - t_name: dwd_interaction_favor_event_di
        c_name: favor_event_type
    alias:
