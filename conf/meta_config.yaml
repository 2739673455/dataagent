    alias:
      - 订单数
      - 下单量
  - name: 下单用户数
    description: 产生订单的去重用户数，公式为 COUNT(DISTINCT user_id)
    relevant_columns:
      - t_name: dwd_trade_order_detail_di
        c_name: user_id
      - t_name: dwd_trade_order_detail_di
        c_name: biz_date
    alias:
