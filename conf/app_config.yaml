# 应用基础配置
port: 7000

cors_origins: []

log:
  level: INFO # 日志级别 (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  rotation: 10MB # 日志文件滚动大小

# 数据连接与检索配置
doris:
  host: 127.0.0.1
  port: 9030
  user: atguigu
  password: ${oc.env:DORIS_ADMIN_PASSWORD}
  database: ecommerce

auth_postgresql:
  host: 127.0.0.1
  port: 5432
  user: atguigu
  password: ${oc.env:POSTGRES_PASSWORD}
  database: auth

meta_postgresql:
  host: 127.0.0.1
  port: 5432
  user: atguigu
  password: ${oc.env:POSTGRES_PASSWORD}
  database: meta

langgraph_postgresql:
  host: 127.0.0.1
  port: 5432
  user: atguigu
  password: ${oc.env:POSTGRES_PASSWORD}
  database: langgraph

doris_credentials:
  encryption_key: ${oc.env:DORIS_CREDENTIAL_ENCRYPTION_KEY}

elasticsearch:
  host: 127.0.0.1
  port: 9200
  column_index: data-agent-column
  metric_index: data-agent-metric
  value_index: data-agent-value
  query_experience_index: data-agent-query-experience
  embedding_size: 1024

embedding:
  base_url: https://api.siliconflow.cn/v1
  api_key: ${oc.env:SILICONFLOW_API_KEY}
  model: BAAI/bge-m3
  timeout: 30.0

# 元数据索引配置
metadata_index:
  value_lookback_seconds: 300

# 后台任务配置
task_queue:
  broker_url: redis://127.0.0.1:6379/0
  result_backend: redis://127.0.0.1:6379/1
  result_expires_seconds: 86400
  task_time_limit_seconds: 3600
  task_soft_time_limit_seconds: 3300
  worker_prefetch_multiplier: 1
  value_index_sync_time: "08:00"
  lifecycle_schedule_seconds: 300
  query_experience_repair_seconds: 300

# 身份与生命周期配置
auth:
  jwt_secret: ${oc.env:JWT_SECRET}
  jwt_algorithm: HS256
  issuer: dataagent
  access_token_minutes: 15
  refresh_token_days: 30
  password_min_length: 6

lifecycle:
  draft_ttl_minutes: 1440
  cleanup_interval_seconds: 300
  cleanup_batch_size: 100
  user_deletion_retry_seconds: 60

# 查询与沙盒配置
query:
  data_source: doris
  timeout_seconds: 60
  memory_limit_bytes: 1073741824
  max_scan_rows: 10000000
  max_scan_bytes: 1073741824
  max_rows: 100000
  max_cell_bytes: 1048576
  max_output_bytes: 33554432
  batch_size: 100
  sample_rows: 5
  output_format: csv

sandbox:
  deployment_namespace: local # 同一 Docker 主机上的部署实例必须使用不同命名空间
  ownership:
    redis_url: redis://127.0.0.1:6379/2
    lock_timeout_seconds: 60
    wait_timeout_seconds: 300
    lease_seconds: 30
  image: dataagent-sandbox:latest
  build_context: docker/sandbox
  build_network_mode: host
  rebuild_image: true # 启动时通过 Docker 构建缓存同步镜像变更
  node_version: 20.19.2
  node_download_base: https://npmmirror.com/mirrors/node
  pypi_index_url: https://mirrors.aliyun.com/pypi/simple
  npm_registry: https://registry.npmmirror.com
  network_mode: none # 运行时断网，依赖统一构建到沙盒镜像
  memory_limit: 2g
  nano_cpus: 2000000000 # 每个用户沙盒最多使用 2 个 CPU 核心
  pids_limit: 256
  execute_timeout_seconds: 120 # 单次 Shell 命令的硬超时上限
  max_output_bytes: 4194304 # 覆盖 DeepAgents 结构化读取的最坏 JSON 转义开销
  max_capture_bytes: 10485760
  max_file_bytes: 104857600
  max_workspace_bytes: 1073741824
  workspace_quota_mode: application # 生产环境应改为 volume_driver 并使用支持硬配额的卷驱动
  volume_driver: local
  volume_driver_options: {}
  max_running_containers: 8 # 按部署机器容量调整，超出后等待或回收空闲容器
  max_capacity_waiters: 2048
  capacity_wait_timeout_seconds: 300
  idle_stop_seconds: 600 # 空闲 10 分钟后停止容器
  idle_remove_seconds: 3600 # 空闲 1 小时后删除容器，但保留用户数据卷
  cleanup_interval_seconds: 60
  cleanup_failure_alert_threshold: 3
  stop_containers_on_shutdown: true

# 模型与智能体配置
lm_config:
  active: deepseek-v4-flash-openrouter
  models:
    deepseek-v4-flash-openrouter:
      model_provider: openai
      model: deepseek/deepseek-v4-flash-0731
      base_url: https://openrouter.ai/api/v1
      api_key: ${oc.env:OPENROUTER_API_KEY}
      params: {}
      profile:
        max_input_tokens: 1048576 # 模型上下文长度，用于计算对话压缩阈值
    qwen3.6-plus-openrouter:
      model_provider: openai
      model: qwen/qwen3.7-flash
      base_url: https://openrouter.ai/api/v1
      api_key: ${oc.env:OPENROUTER_API_KEY}
      params: {}
      profile:
        max_input_tokens: 1000000 # 模型上下文长度，用于计算对话压缩阈值

agent:
  orchestration:
    mode: dynamic_subagents
    max_parallel_sessions: 8
    max_delegations_per_run: 20
    max_continuations: 3
    max_session_resumes: 3
    max_repair_rounds: 3
    max_repair_depth: 5
    session_lock_timeout: 300
  interpreter:
    mode: thread
    ptc:
      - delegate_agent
    timeout_seconds: 30
    memory_limit_bytes: 67108864
  specialists:
    explorer:
      model: default
    analyst:
      model: default
    reviewer:
      model: default
    visualizer:
      model: default

# 外部工具配置
mcp: # 格式参考：https://docs.langchain.com/oss/python/langchain/mcp#transports
  tavily:
    transport: streamable_http
    url: https://mcp.tavily.com/mcp/?tavilyApiKey=${oc.env:TAVILY_API_KEY}
