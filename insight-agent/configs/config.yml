db: # 数据库
  driver: mysql # 数据库驱动
  configs:
    mysql:
      host: 127.0.0.1
      port: 3306
      user: root
      password: ${oc.env:APP_DB_PASSWORD}
      database: chat

redis: # Redis
  host: 127.0.0.1
  port: 6379
  password: ${oc.env:REDIS_PASSWORD}
  db: 0

log: # 日志
  to_console: true # 是否输出到控制台
  to_console_level: INFO # 日志级别(DEBUG, INFO, WARNING, ERROR, CRITICAL)
  to_file: true # 是否输出到文件
  to_file_level: INFO # 日志级别(DEBUG, INFO, WARNING, ERROR, CRITICAL)
  log_dir: app # 日志目录
  max_file_size: 10MB # 单个日志文件最大大小

lm_config:
  active: gpt-4o-mini
  models:
    gpt-4o-mini:
      model: openai/gpt-4o-mini
      base_url: https://openrouter.ai/api/v1
      api_key: ${oc.env:OPENROUTER_API_KEY}
      params: {}

mcp: # MCP 工具
  tavily:
    transport: streamable_http
    url: https://mcp.tavily.com/mcp/?tavilyApiKey=${oc.env:TAVILY_API_KEY}

auth_service: # 认证服务
  base_url: http://127.0.0.1:7100 # 认证服务url
  introspection: /api/introspection # 校验访问令牌

data_agent: # 数据查询 Agent
  base_url: http://127.0.0.1:8000 # 数据查询 Agent url
  query: /api/query

cors_origins: [] # 允许跨域请求的源

port: 7300
