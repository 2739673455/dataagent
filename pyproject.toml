[project]
dependencies = [
  "asyncmy>=0.2.11",
  "celery[redis]>=5.6.3,<6",
  "cryptography>=46.0.4",
  "deepagents[quickjs]>=0.7.1,<0.8",
  "docker>=7.1,<8",
  "elasticsearch[async]>=8.19,<9",
  "fastapi>=0.135.1",
  "httpx>=0.28.1",
  "langchain>=1.2.7",
  "langchain-mcp-adapters>=0.2.1",
  "langchain-openai>=1.1.7",
  "langchain-openrouter>=0.2.8,<0.3",
  "langgraph>=1.0.7",
  "langgraph-checkpoint-postgres>=3.1.2",
  "loguru>=0.7.3",
  "omegaconf>=2.3.0",
  "pwdlib[argon2]>=0.3.0",
  "pyjwt>=2.10.1",
  "psycopg[binary,pool]>=3.3.4",
  "python-dotenv>=1.2.2",
  "python-multipart>=0.0.32",
  "pyyaml>=6.0.3",
  "sqlalchemy>=2.0.46",
  "sqlglot>=27.0.0",
  "uvicorn[standard]>=0.52.0",
]
description = "Intelligent data querying and analysis"
name = "data-agent"
requires-python = ">=3.13"
version = "0.1.0"

[dependency-groups]
dev = [
  "pyright>=1.1.410",
  "pytest>=9.1.1",
  "ruff>=0.15.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venv = ".venv"
venvPath = "."
reportDeprecated = "warning"
include = ["app", "main.py", "scripts", "tests"]
exclude = [
  "**/.*",
  "**/__pycache__",
  "**/node_modules",
  ".venv",
  "dbmock",
  "web",
]

[tool.ruff]
extend-exclude = [
  "dbmock",
]

