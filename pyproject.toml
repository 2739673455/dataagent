[project]
dependencies = [
  "asyncmy>=0.2.11",
  "cryptography>=46.0.4",
  "deepagents>=0.4.7",
  "elasticsearch[async]>=8.19,<9",
  "fastapi>=0.135.1",
  "httpx>=0.28.1",
  "jieba>=0.42.1",
  "langchain>=1.2.7",
  "langchain-mcp-adapters>=0.2.1",
  "langchain-openai>=1.1.7",
  "langgraph>=1.0.7",
  "langgraph-checkpoint-postgres>=3.1.2",
  "loguru>=0.7.3",
  "mcp>=1.24,<2",
  "omegaconf>=2.3.0",
  "openai>=2.16.0",
  "pandas>=3.0.1",
  "psycopg[binary,pool]>=3.3.4",
  "python-dotenv>=1.2.2",
  "python-multipart>=0.0.32",
  "pyyaml>=6.0.3",
  "sqlalchemy>=2.0.46",
