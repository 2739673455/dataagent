name: dataagent

services:
  sandbox-image:
    image: ${SANDBOX_IMAGE:-dataagent-sandbox:latest}
    pull_policy: never
    build:
      context: ./sandbox
      args:
        APT_MIRROR: ${SANDBOX_APT_MIRROR:-https://mirrors.aliyun.com/debian}
        APT_SECURITY_MIRROR: ${SANDBOX_APT_SECURITY_MIRROR:-https://mirrors.aliyun.com/debian-security}
        PYPI_INDEX_URL: ${SANDBOX_PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        NPM_REGISTRY: ${SANDBOX_NPM_REGISTRY:-https://registry.npmmirror.com}
    deploy:
      replicas: 0

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PG_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: atguigu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in conf/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atguigu -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  elasticsearch:
    build: ./elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: false
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
    mem_limit: 4g
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  redis:
    image: redis:8.10.0-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Optional local business cluster. Omit the profile to use an existing database.
  business-postgres:
    profiles: ["local-business"]
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BUSINESS_PG_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: ${BUSINESS_PG_DATABASE:-ecommerce}
      POSTGRES_USER: ${BUSINESS_PG_ADMIN_USER:-dataagent_admin}
      POSTGRES_PASSWORD: ${BUSINESS_PG_ADMIN_PASSWORD:?Set BUSINESS_PG_ADMIN_PASSWORD in conf/.env}
    volumes:
      - business-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  es-data:
  redis-data:
  business-postgres-data:
