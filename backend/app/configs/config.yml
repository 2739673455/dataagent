db: # 数据库
  app: # 应用数据库
    host: 127.0.0.1
    port: 3306
    user: root
    password: ${oc.env:APP_DB_PASSWORD}
    database: app
  auth: # 认证数据库
    host: 127.0.0.1
    port: 3306
    user: root
    password: ${oc.env:AUTH_DB_PASSWORD}
    database: auth

log: # 日志
  app: # 应用日志
    to_console: true # 是否输出到控制台
    to_console_level: INFO # 日志级别(DEBUG, INFO, WARNING, ERROR, CRITICAL)
    to_file: true # 是否输出到文件
    to_file_level: INFO # 日志级别(DEBUG, INFO, WARNING, ERROR, CRITICAL)
    log_dir: app # 日志目录
    max_file_size: 10MB # 单个日志文件最大大小
  auth: # 认证日志
    to_console: true # 是否输出到控制台
    to_console_level: ERROR # 日志级别(DEBUG, INFO, WARNING, ERROR, CRITICAL)
    to_file: true # 是否输出到文件
    to_file_level: INFO # 日志级别(DEBUG, INFO, WARNING, ERROR, CRITICAL)
    log_dir: auth # 日志目录
    max_file_size: 10MB # 单个日志文件最大大小

auth: # 认证配置
  secret_key: ${oc.env:AUTH_SECRET_KEY} # 私钥
  algorithm: HS256 # 加密算法
  access_token_expire_minutes: 60 # 访问令牌过期时间（分钟）
  refresh_token_expire_days: 7 # 刷新令牌过期时间（天）

cos: # 腾讯云COS配置
  bucket: chat-${oc.env:COS_APP_ID} # 存储桶名称，格式：bucketName-appid
  secret_id: ${oc.env:COS_SECRET_ID} # 腾讯云COS SECRET-ID
  secret_key: ${oc.env:COS_SECRET_KEY} # 腾讯云COS SECRET-KEY
  region: ap-beijing # 存储桶所在地域
  token: null # 临时密钥Token，如不使用则置为null
  scheme: https # 访问协议，http或https

encryption_key: ${oc.env:ENCRYPTION_KEY} # 模型访问API-Key加密密钥，16、24或32字节长
cors_origins: [] # 允许跨域请求的源
